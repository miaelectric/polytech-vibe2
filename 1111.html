<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    /* CSS: 모양 */
    h1 { color: #FFFF00; }
    button { padding: 12px 20px; }
  </style>
</head>
<body>
  <!-- HTML: 내용 -->
  <h1>모아로지스</h1>
  <button id="hello">오늘 마감 시간 보기</button>

  <script>
    // JavaScript: 동작
    document.getElementById('hello').onclick = function () {
      alert('오늘 접수 마감은 오후 6시입니다!');
    };
  </script>
</body>
</html>
